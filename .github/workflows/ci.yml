name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  test-build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: radar
          POSTGRES_PASSWORD: radar
          POSTGRES_DB: radarvpo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U radar"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://radar:radar@localhost:5432/radarvpo_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install workspace dependencies
        run: npm ci

      # ESLint tipa contra @prisma/client; sin generate el cliente es any y
      # aparecen miles de @typescript-eslint/no-unsafe-*.
      - name: Generate Prisma client
        run: npm --workspace backend run prisma:generate

      - name: Backend lint
        run: npm --workspace backend run lint

      - name: Backend unit tests
        run: npm --workspace backend run test:unit

      # Base de datos desechable del job: valida también que las migraciones se aplican desde cero.
      - name: Apply migrations to CI database
        run: npm --workspace backend run prisma:deploy
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}

      - name: Backend integration tests
        run: npm --workspace backend run test:integration

      - name: Frontend lint
        run: npm --workspace frontend run lint

      - name: Frontend tests
        run: npm --workspace frontend run test

      - name: Backend build
        run: npm --workspace backend run build

      - name: Frontend build
        run: npm --workspace frontend run build
